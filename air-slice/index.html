<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Air Slice v1.2 — Gesture Arcade</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071223;color:#fff;font:16px system-ui,Arial}canvas{width:100vw;height:100dvh;display:block;touch-action:none}button{background:#40e5cb;color:#052a2b;border:0;border-radius:13px;padding:11px 17px;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}#top{position:fixed;top:12px;left:16px;display:flex;gap:16px;align-items:center;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}#actions{position:fixed;top:10px;right:12px;display:flex;gap:8px}#diag{position:fixed;left:12px;top:56px;padding:8px 11px;border-radius:10px;background:#112b42df;border:1px solid #537c96;font-size:12px;max-width:min(66vw,570px);white-space:pre-wrap;line-height:1.45}#stats{position:fixed;right:14px;top:66px;background:#10283fdd;border:1px solid #537c96;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;min-width:140px}#help{position:fixed;bottom:14px;left:12px;color:#dcf6fa;font-size:12px;text-shadow:0 2px 4px #000;max-width:70vw}#cam{position:fixed;bottom:12px;right:12px;width:125px;max-width:23vw;aspect-ratio:4/3;object-fit:cover;border:2px solid #40e5cb;border-radius:12px;transform:scaleX(-1);background:#17334b}#video{display:none}#version{font-size:12px;color:#b1dce9}#mode{position:fixed;right:14px;top:144px;background:#10283fdd;padding:8px;border-radius:8px;font-size:12px}select{background:#10283f;color:white;border:1px solid #537c96;border-radius:7px;padding:5px}@media(max-width:700px){#top{gap:8px;font-size:13px}#stats{top:106px}#diag{max-width:65vw}#mode{top:180px}}
</style></head><body><canvas id="game"></canvas><div id="top"><span id="score">Score 0</span><span id="missed">Missed 0/5</span><span id="version">AIR SLICE v1.2</span></div><div id="actions"><button id="start">Start camera</button><button id="restart">New game</button><button id="pause">Pause</button></div><div id="diag">Ready. Tap Start camera. The game also supports touch / mouse slicing.</div><div id="stats">AI FPS: —<br>Inference: —<br>Hand: —</div><div id="mode">Delegate <select id="delegate"><option selected>GPU</option><option>CPU</option></select></div><div id="help">Move your index finger across fruit to slice. Fist gestures are disabled. Pause or resume using the on-screen button.</div><video id="video" autoplay muted playsinline></video><video id="cam" autoplay muted playsinline></video>
<script type="module">
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),video=$('#video'),cam=$('#cam');const stat=$('#stats'),diag=$('#diag'),scoreText=$('#score'),missText=$('#missed'),start=$('#start'),restart=$('#restart'),pauseBtn=$('#pause'),delegate=$('#delegate');
const palette=[['#ff4c65','#ffb2ac'],['#ffb742','#ffe38b'],['#9ef16b','#daffa3'],['#ca84f5','#edd4ff'],['#ff7d42','#ffd59a']];let w=innerWidth,h=innerHeight,dpr=1;
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let fruits=[],particles=[],trail=[],points=0,misses=0,paused=false,gameOver=false,spawnClock=0,gameTime=0,lastTime=performance.now(),handSeen=false;let lastFinger=null,videoTime=-1,landmarker=null,stream=null,generation=0,frames=0,inferMs=0,windowAt=performance.now(),fps=0,latency=0,lastHandAt=0;
function message(s){diag.textContent=s}function scores(){scoreText.textContent='Score '+points;missText.textContent='Missed '+misses+'/5'}function reset(){fruits=[];particles=[];trail=[];points=0;misses=0;paused=false;gameOver=false;spawnClock=0;gameTime=0;lastFinger=null;pauseBtn.textContent='Pause';scores();message('Game ready — move index finger to slice. Gesture pause is off; use Pause button.')}reset();
function launch(){const r=Math.max(17,Math.min(31,w*.026));const x=r+40+Math.random()*Math.max(1,w-2*(r+40));const apex=h*(.37+Math.random()*.23);const speed=Math.sqrt(Math.max(200,2*720*(h-apex)));const vx=(Math.random()-.5)*Math.min(190,w*.21);fruits.push({x,y:h+r+12,vx,vy:-speed,r,kind:Math.floor(Math.random()*palette.length),spin:Math.random()*6.3,rotation:(Math.random()-.5)*2.4,cut:false})}
function splatter(x,y,kind){const colors=palette[kind];for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*230;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.44,color:colors[i%2],radius:2+Math.random()*5})}}
function intersects(ax,ay,bx,by,cx,cy,r){let dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;let t=len?clamp(((cx-ax)*dx+(cy-ay)*dy)/len,0,1):0;return Math.hypot(ax+t*dx-cx,ay+t*dy-cy)<=r}
// Collision checks use the entire fingertip movement segment, not just the latest point.
// A small extra hit radius compensates for low (~15 FPS) hand-tracking sample rate.
function slicePath(a,b,source){
 if(!a||!b||paused||gameOver)return;
 const len=distance(a,b),dt=(b.t-a.t)/1000;
 if(len<6||dt<=0||dt>.50||len>Math.max(w,h)*.65)return;
 if(source==='hand'&&len/dt<65)return; // Ignore an almost stationary hand.
 for(const fruit of fruits){
   if(fruit.cut)continue;
   const padding=source==='hand'?Math.min(19,10+len*.035):7;
   if(intersects(a.x,a.y,b.x,b.y,fruit.x,fruit.y,fruit.r+padding)){
     fruit.cut=true;points+=10;scoreText.textContent='Score '+points;splatter(fruit.x,fruit.y,fruit.kind);
   }
 }
}
function pointer(x,y,source,t=performance.now()){
 const next={x,y,t};
 // Allow linking consecutive MediaPipe samples up to 450 ms apart.
 if(!lastFinger||lastFinger.source!==source||t-lastFinger.t>450){
   lastFinger={...next,source};trail.push({...next,life:.27});return;
 }
 slicePath(lastFinger,next,source);
 // Short extrapolation along motion direction to partially compensate for inference lag.
 // Only apply to genuine hand swipes, with a strict 48px maximum extension.
 const dx=next.x-lastFinger.x,dy=next.y-lastFinger.y,delta=t-lastFinger.t;
 if(source==='hand'&&delta>0&&Math.hypot(dx,dy)>12){
   const factor=Math.min(.55,55/delta,48/Math.hypot(dx,dy));
   const predicted={x:clamp(x+dx*factor,0,w),y:clamp(y+dy*factor,0,h),t:t+Math.max(1,delta*factor)};
   slicePath(next,predicted,source);
 }
 lastFinger={...next,source};trail.push({...next,life:.27});
}
function drawFruit(f){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.spin);let c=palette[f.kind];ctx.shadowBlur=13;ctx.shadowColor=c[0];ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fillStyle=c[0];ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.ellipse(-f.r*.26,-f.r*.27,f.r*.36,f.r*.19,-.7,0,Math.PI*2);ctx.fillStyle=c[1];ctx.fill();ctx.strokeStyle='#694d2e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-f.r);ctx.lineTo(3,-f.r-10);ctx.stroke();ctx.fillStyle='#6cda75';ctx.beginPath();ctx.ellipse(9,-f.r-6,9,4,-.4,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(t){let dt=Math.min(.05,(t-lastTime)/1000);lastTime=t;let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#112d45');bg.addColorStop(1,'#061120');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#20445b';ctx.lineWidth=1;for(let x=0;x<w;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}if(!paused&&!gameOver){gameTime+=dt;spawnClock+=dt;if(spawnClock>Math.max(.56,1.25-gameTime*.005)){spawnClock=0;launch()}}
for(let i=fruits.length-1;i>=0;i--){let f=fruits[i];if(!paused&&!gameOver){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=720*dt;f.spin+=f.rotation*dt}if(f.cut){fruits.splice(i,1);continue}drawFruit(f);if(f.y-f.r>h+15){fruits.splice(i,1);if(!paused&&!gameOver){misses++;scores();if(misses>=5){gameOver=true;message('Game over. Tap New game to restart.')}}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
for(let i=trail.length-1;i>=0;i--){trail[i].life-=dt;if(trail[i].life<=0)trail.splice(i,1)}if(trail.length>1){ctx.save();ctx.strokeStyle='#88fff1';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#72eaff';ctx.shadowBlur=18;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore()}
if(!landmarker&&fruits.length===0&&!gameOver){ctx.textAlign='center';ctx.fillStyle='#ecfeff';ctx.font=`bold ${Math.min(45,w/13)}px system-ui`;ctx.fillText('AIR SLICE',w/2,h*.41);ctx.font='17px system-ui';ctx.fillText('Start camera or drag on screen to test',w/2,h*.41+38)}if(paused||gameOver){ctx.fillStyle='#061120b8';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.fillStyle='white';ctx.font=`bold ${Math.min(42,w/12)}px system-ui`;ctx.fillText(gameOver?'GAME OVER':'PAUSED',w/2,h*.44);ctx.font='16px system-ui';ctx.fillText(gameOver?'Tap New game to restart':'Tap Resume button',w/2,h*.44+38)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
async function startAI(){const thisRun=++generation;start.disabled=true;delegate.disabled=true;try{message('Requesting front camera…');if(stream)stream.getTracks().forEach(t=>t.stop());if(landmarker){landmarker.close();landmarker=null}stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:24}}});video.srcObject=stream;cam.srcObject=stream;await video.play();await cam.play().catch(()=>{});message('Camera working. Loading local MediaPipe assets…');const {HandLandmarker,FilesetResolver}=await import('../vendor/vision_bundle.mjs');const vision=await FilesetResolver.forVisionTasks('../vendor/wasm');landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'../models/hand_landmarker.task',delegate:delegate.value},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.35,minHandPresenceConfidence:.35,minTrackingConfidence:.35});if(thisRun!==generation)return;reset();message('Air Slice v1.2 ready ✓ ('+delegate.value+', camera '+video.videoWidth+'×'+video.videoHeight+'). Point at flying fruit to slice.');frames=0;inferMs=0;fps=0;latency=0;videoTime=-1;windowAt=performance.now();requestAnimationFrame(t=>infer(t,thisRun));start.textContent='Restart camera'}catch(e){message('AI startup error: '+(e?.message||e)+'\nCheck that air-slice/ is alongside vendor/ and models/ in your GitHub Pages repository.');console.error(e)}finally{start.disabled=false;delegate.disabled=false}}
function infer(t,run){if(run!==generation||!landmarker)return;if(video.readyState>=2&&video.currentTime!==videoTime){videoTime=video.currentTime;try{let before=performance.now();let result=landmarker.detectForVideo(video,t);inferMs+=performance.now()-before;frames++;let now=performance.now();if(now-windowAt>=1600){fps=1000*frames/(now-windowAt);latency=inferMs/frames;frames=0;inferMs=0;windowAt=now}handSeen=Boolean(result.landmarks?.length);stat.innerHTML=`AI FPS: ${fps.toFixed(1)}<br>Inference: ${latency.toFixed(1)} ms<br>Hand: ${handSeen?'Detected':'Not detected'}<br>Pause gesture: disabled<br>Delegate: ${delegate.value}`;if(handSeen){const p=result.landmarks[0],tip=p[8];lastHandAt=t;pointer(clamp(1-tip.x,0,1)*w,clamp(tip.y,0,1)*h,'hand',t)}else if(t-lastHandAt>350){lastFinger=null}}catch(e){message('Inference error: '+(e?.message||e))}}requestAnimationFrame(next=>infer(next,run))}
start.onclick=startAI;restart.onclick=reset;pauseBtn.onclick=()=>{if(gameOver)return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';lastFinger=null;message(paused?'Paused — tap Resume to continue':'Resumed — slice fruit');};let down=false;canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);lastFinger=null;pointer(e.clientX,e.clientY,'touch')});canvas.addEventListener('pointermove',e=>{if(down)pointer(e.clientX,e.clientY,'touch')});for(let name of ['pointerup','pointercancel'])canvas.addEventListener(name,()=>{down=false;lastFinger=null});window.addEventListener('unhandledrejection',e=>message('Unexpected error: '+String(e.reason?.message||e.reason)));
</script></body></html>
